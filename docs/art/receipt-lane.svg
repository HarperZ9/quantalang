<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a scientific-runtime receipt: kernel, run, units, invariant, mode, seal, chain, re-derive. A numeric program's stdout is captured as a measurement series. A declared physical unit is canonicalized through a dependency-free dimensional-analysis core. One of eight invariants is checked over the series, each with a paired negative fixture that has to fail for the right reason. The mode records how the number was produced: deterministic, exact probabilistic, seeded stochastic, Monte Carlo with its estimator and interval, or budgeted search with its step ceiling. The seal carries the series, the claim, and the denominator. Any number of receipts chain into one ordered tamper-evident bundle, and verification re-runs the program rather than trusting the seal. Three outcomes: verified, failed, and refused."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE NUMERIC RUN, SEALED AND RE-CHECKABLE</text><text class="h" x="44" y="72">How a measured result carries the terms it was measured under</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H143.25V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">EACH MODE SEALS ITS OWN DENOMINATOR</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Kernel</text><text class="s" x="58" y="168">A numeric program, and the</text><text class="s" x="58" y="183">claim it makes.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Run</text><text class="s" x="282.5" y="168">Its output captured as a</text><text class="s" x="282.5" y="183">measurement series.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Units</text><text class="s" x="507" y="168">A declared unit, checked</text><text class="s" x="507" y="183">dimensionally.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Invariant</text><text class="s" x="731.5" y="168">One of eight, checked over the</text><text class="s" x="731.5" y="183">series.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Mode</text><text class="s" x="58" y="360">How the number was produced,</text><text class="s" x="58" y="375">recorded.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Seal</text><text class="s" x="282.5" y="360">The series, the claim, and the</text><text class="s" x="282.5" y="375">denominator.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Chain</text><text class="s" x="507" y="360">Receipts bound into one</text><text class="s" x="507" y="375">ordered bundle.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Re-derive</text><text class="s" x="731.5" y="360">Verify re-runs the program,</text><text class="s" x="731.5" y="375">then checks.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">VERIFIED</text><text class="s" x="58" y="509" font-size="10.5">the re-run reproduces the sealed claim</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">FAILED</text><text class="s" x="357.33" y="509" font-size="10.5">the invariant does not hold on the series</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">REFUSED</text><text class="s" x="656.67" y="509" font-size="10.5">a model-observing program gets no receipt</text><text class="s" x="44" y="546">A program that observes a model gets no receipt at all. Models propose, oracles dispose.</text></svg>
