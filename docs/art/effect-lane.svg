<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of the effect check: source, signature, checker, surface, profile, check, receipt, re-verify. A function that reads a file has to say so in its signature, and the checker follows effects through function values, closures, struct fields, control flow, and async blocks, so a callback cannot launder a capability. The whole set is the program's capability surface. A policy profile names what this build may reach, and the check compares one against the other before anything is built. The receipt seals the declared effects, the capabilities, and the source digests, and verification re-runs the check against the current bytes rather than replaying a stored answer. Two outcomes: passed, and rejected."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE FUNCTION, ONE CAPABILITY SURFACE</text><text class="h" x="44" y="72">How ambient access stops being invisible and becomes a type</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">VERIFY RE-RUNS THE CHECK, IT DOES NOT REPLAY IT</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Source</text><text class="s" x="58" y="168">One function, and the calls it</text><text class="s" x="58" y="183">really makes.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Signature</text><text class="s" x="282.5" y="168">Ambient access, written into</text><text class="s" x="282.5" y="183">the type.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Checker</text><text class="s" x="507" y="168">Effects followed through</text><text class="s" x="507" y="183">closures and fields.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Surface</text><text class="s" x="731.5" y="168">The whole capability set the</text><text class="s" x="731.5" y="183">program needs.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Profile</text><text class="s" x="58" y="360">A policy naming what this</text><text class="s" x="58" y="375">build may reach.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Check</text><text class="s" x="282.5" y="360">Surface against profile,</text><text class="s" x="282.5" y="375">before any build.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Receipt</text><text class="s" x="507" y="360">Effects, capabilities, and</text><text class="s" x="507" y="375">source digests.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Re-verify</text><text class="s" x="731.5" y="360">The check runs again on</text><text class="s" x="731.5" y="375">current bytes.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H255.5V472"/><rect x="44" y="472" width="423" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">PASSED</text><text class="s" x="58" y="509" font-size="10.5">the surface stays inside the profile</text><path class="thin" d="M816.75 448H704.5V472"/><rect x="493" y="472" width="423" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="507" y="493" font-size="13">REJECTED</text><text class="s" x="507" y="509" font-size="10.5">an effect this profile does not allow, named</text><text class="s" x="44" y="546">Verification re-runs the check against current source bytes. It never replays a stored answer.</text></svg>
